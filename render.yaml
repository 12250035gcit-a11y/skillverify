services:
  - type: web
    name: skillverify-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /jobs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skillverify-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: skillverify-db
    plan: free
    databaseName: freelance_platform
    user: skillverify
